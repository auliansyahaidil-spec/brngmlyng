<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dhea Phoenix Adventure - SMKN 1 Sanden</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden; /* Mencegah scrollbar */
            background-color: #0d0121; /* Warna gelap senada dengan tema Dhea */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: 'Times New Roman', Times, serif; /* Serupa dengan font "Dhea" */
        }

        #gameContainer {
            position: relative;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.5); /* Shadow emas */
        }

        canvas {
            display: block;
            background: linear-gradient(to bottom, #1a0242 0%, #3e1675 100%); /* Background langit fantasi */
            border: 4px solid #d4af37; /* Border emas */
            border-radius: 10px;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Klik tembus ke canvas */
            display: flex;
            flex-direction: column;
        }

        /* Bagian Atas - Tempat Gambar Aset */
        #header-assets {
            height: 120px; /* Ruang untuk logo di atas */
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 10px;
            background: rgba(13, 1, 33, 0.8); /* Overlay gelap transparan */
            border-bottom: 2px solid #d4af37;
        }

        .logo-small {
            height: 60px; /* Ukuran logo sekolah/proyek */
            width: auto;
            filter: drop-shadow(0 0 5px rgba(212, 175, 55, 0.8));
        }

        #logo-dhea-main {
            height: 100px; /* Emblem Dhea lebih besar di tengah */
            width: auto;
        }

        /* UI Score dan Level */
        #game-info {
            position: absolute;
            top: 130px;
            left: 20px;
            font-size: 24px;
            color: #fbbf24; /* Warna emas terang */
            text-shadow: 2px 2px 4px #000;
            pointer-events: auto;
        }

        /* Overlay Tombol Mulai/Game Over */
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            text-align: center;
        }

        #overlay h1 {
            font-size: 48px;
            color: #d4af37;
            margin-bottom: 10px;
        }

        #overlay p {
            font-size: 20px;
            margin-bottom: 30px;
        }

        .game-btn {
            padding: 15px 40px;
            font-size: 22px;
            background: linear-gradient(45deg, #d4af37, #fbb03b);
            color: #0d0121;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4);
            transition: transform 0.1s;
        }

        .game-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div id="gameContainer">
        <canvas id="gameCanvas" width="480" height="720"></canvas>
        
        <div id="ui-layer">
            <!-- BAGIAN ATAS: Gambar-gambar Aset -->
            <div id="header-assets">
                <img src="smk.png" alt="SMK N 1 Sanden" class="logo-small">
                <img src="rpl.png" alt="RPL" class="logo-small">
                <img src="logo.png" alt="Dhea Emblem" id="logo-dhea-main">
                <img src="moko.png" alt="Moko Game Dev" class="logo-small">
                <img src="oon.png" alt="Onesand" class="logo-small">
            </div>

            <!-- Score & Level -->
            <div id="game-info">
                Skor: <span id="scoreDisplay">0</span><br>
                Level: <span id="levelDisplay">1</span>
            </div>

            <!-- Overlay Layar Mulai / Game Over -->
            <div id="overlay">
                <h1 id="overlayTitle">Dhea Phoenix Adventure</h1>
                <p id="overlayText">Tekan 'LOMPAT' atau Spasi untuk memulai</p>
                <button class="game-btn" id="startBtn" onclick="startGame()">MULAI GAME</button>
                <button class="game-btn" id="jumpBtn" style="display:none; position:absolute; bottom: 50px; right: 50px;">LOMPAT</button>
            </div>
        </div>
    </div>

<script>
    // --- KONFIGURASI GAME ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const levelDisplay = document.getElementById('levelDisplay');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlayText = document.getElementById('overlayText');
    const startBtn = document.getElementById('startBtn');
    const jumpBtn = document.getElementById('jumpBtn');

    // Jarak aman di atas untuk aset (header height)
    const HEADER_HEIGHT = 120; 

    // Keadaan Game
    let gameState = 'standby'; // standby, playing, gameover
    let score = 0;
    let level = 1;
    let loop;
    let frameCount = 0;

    // --- MEMUAT ASET GAMBAR BURUNG ---
    const imgBurung = new Image();
    imgBurung.src = 'burung.png'; // Pastikan file ini ada

    // --- MEMUAT SUARA (Synthesized, tanpa file eksternal) ---
    // Gunakan Web Audio API untuk suara sederhana
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(frequency, duration, type = 'sine') {
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.type = type;
        oscillator.frequency.setValueAtTime(frequency, audioCtx.currentTime);
        gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime); // Volume pelan
        gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        oscillator.start();
        oscillator.stop(audioCtx.currentTime + duration);
    }

    // Suara spesifik
    const soundJump = () => playSound(600, 0.1);
    const soundScore = () => playSound(1200, 0.1, 'triangle');
    const soundHit = () => playSound(150, 0.5, 'sawtooth');
    const soundLevelUp = () => { playSound(800, 0.1); setTimeout(()=>playSound(1000, 0.1), 100); };

    // --- OBJEK GAME ---

    // 1. Karakter Burung (Dhea Phoenix)
    const dhea = {
        x: 80,
        y: canvas.height / 2,
        width: 60, // Sesuaikan dengan aspek rasio burung.png Anda
        height: 45,
        gravity: 0.6,
        jumpStrength: -10,
        velocity: 0,
        angle: 0, // Untuk rotasi

        draw: function() {
            ctx.save();
            ctx.translate(this.x + this.width / 2, this.y + this.height / 2);
            
            // Rotasi berdasarkan kecepatan vertikal
            this.angle = Math.atan(this.velocity / 15);
            ctx.rotate(this.angle);

            if (imgBurung.complete) {
                // Gambar aset burung Phoenix
                ctx.drawImage(imgBurung, -this.width / 2, -this.height / 2, this.width, this.height);
            } else {
                // Placeholder jika gambar belum dimuat
                ctx.fillStyle = '#fbbf24';
                ctx.fillRect(-this.width / 2, -this.height / 2, this.width, this.height);
            }
            ctx.restore();
        },

        update: function() {
            if (gameState !== 'playing') return;

            this.velocity += this.gravity;
            this.y += this.velocity;

            // Batas bawah (tanah)
            if (this.y + this.height > canvas.height) {
                this.y = canvas.height - this.height;
                endGame();
            }

            // Batas atas (header aset)
            if (this.y < HEADER_HEIGHT) {
                this.y = HEADER_HEIGHT;
                this.velocity = 0;
            }
        },

        jump: function() {
            if (gameState !== 'playing') return;
            this.velocity = this.jumpStrength;
            soundJump();
        }
    };

    // 2. Rintangan (Pipa Emas)
    const obstacles = {
        gap: 170, // Jarak vertikal antar pipa
        width: 80,
        speed: 3,
        list: [],

        draw: function() {
            ctx.fillStyle = '#a17a04'; // Warna emas gelap pipa
            ctx.strokeStyle = '#d4af37'; // Border emas terang
            ctx.lineWidth = 4;

            this.list.forEach(p => {
                // Pipa Atas
                ctx.fillRect(p.x, HEADER_HEIGHT, this.width, p.topHeight);
                ctx.strokeRect(p.x, HEADER_HEIGHT, this.width, p.topHeight);

                // Pipa Bawah
                const bottomPillY = HEADER_HEIGHT + p.topHeight + this.gap;
                const bottomPillHeight = canvas.height - bottomPillY;
                ctx.fillRect(p.x, bottomPillY, this.width, bottomPillHeight);
                ctx.strokeRect(p.x, bottomPillY, this.width, bottomPillHeight);
            });
        },

        update: function() {
            if (gameState !== 'playing') return;

            // Tambah rintangan baru setiap X frame
            if (frameCount % (120 - (level * 5)) === 0) { // Semakin tinggi level, semakin cepat muncul
                const minTopHeight = 50;
                const maxTopHeight = canvas.height - HEADER_HEIGHT - this.gap - 50;
                const topHeight = Math.random() * (maxTopHeight - minTopHeight) + minTopHeight;
                
                this.list.push({
                    x: canvas.width,
                    topHeight: topHeight,
                    passed: false
                });
            }

            // Gerakkan dan cek rintangan
            for (let i = this.list.length - 1; i >= 0; i--) {
                let p = this.list[i];
                p.x -= this.speed + (level * 0.5); // Kecepatan bertambah per level

                // Cek Skor
                if (!p.passed && dhea.x > p.x + this.width) {
                    p.passed = true;
                    updateScore();
                }

                // Cek Tabrakan
                if (
                    dhea.x + dhea.width * 0.8 > p.x && 
                    dhea.x < p.x + this.width &&
                    (dhea.y < HEADER_HEIGHT + p.topHeight || dhea.y + dhea.height * 0.8 > HEADER_HEIGHT + p.topHeight + this.gap)
                ) {
                    endGame();
                }

                // Hapus rintangan yang lewat
                if (p.x + this.width < 0) {
                    this.list.splice(i, 1);
                }
            }
        },

        reset: function() {
            this.list = [];
            this.speed = 3;
            this.gap = 170;
        }
    };

    // 3. Background (Efek Feathers jatuh)
    const feathers = {
        list: [],
        draw: function() {
            ctx.fillStyle = 'rgba(251, 191, 36, 0.3)'; // Bulu emas transparan
            this.list.forEach(f => {
                ctx.beginPath();
                ctx.ellipse(f.x, f.y, f.r, f.r * 2, f.angle, 0, Math.PI * 2);
                ctx.fill();
            });
        },
        update: function() {
            if (Math.random() < 0.05) {
                this.list.push({
                    x: Math.random() * canvas.width,
                    y: HEADER_HEIGHT,
                    r: Math.random() * 4 + 2,
                    speed: Math.random() * 2 + 1,
                    angle: Math.random() * Math.PI
                });
            }
            for (let i = this.list.length - 1; i >= 0; i--) {
                let f = this.list[i];
                f.y += f.speed;
                f.x += Math.sin(f.y / 20); // Gerakan meliuk
                if (f.y > canvas.height) this.list.splice(i, 1);
            }
        }
    }


    // --- LOGIKA UTAMA GAME ---

    function gameLoop() {
        // Clear canvas (hanya area game, header UI pakai HTML/CSS)
        ctx.clearRect(0, HEADER_HEIGHT, canvas.width, canvas.height - HEADER_HEIGHT);

        // Update objek
        feathers.update();
        dhea.update();
        obstacles.update();

        // Draw objek
        feathers.draw();
        dhea.draw();
        obstacles.draw();

        frameCount++;
        loop = requestAnimationFrame(gameLoop);
    }

    // --- KONTROL ---

    function updateScore() {
        score++;
        scoreDisplay.innerText = score;
        soundScore();

        // Level Up setiap 10 poin
        if (score % 10 === 0) {
            level++;
            levelDisplay.innerText = level;
            soundLevelUp();
        }
    }

    function startGame() {
        if (gameState === 'playing') return;
        
        initAudio(); // Aktivasi audio context saat klik pertama

        gameState = 'playing';
        score = 0;
        level = 1;
        scoreDisplay.innerText = '0';
        levelDisplay.innerText = '1';
        
        dhea.reset();
        dhea.y = canvas.height / 2;
        obstacles.reset();
        
        overlay.style.display = 'none';
        jumpBtn.style.display = 'block'; // Tampilkan tombol lompat di mobile
        
        if (!loop) gameLoop();
    }

    function endGame() {
        if (gameState !== 'playing') return;
        
        gameState = 'gameover';
        soundHit();
        
        overlay.style.display = 'flex';
        jumpBtn.style.display = 'none';
        
        overlayTitle.innerText = "GAME OVER";
        overlayText.innerText = `Skor Akhir Anda: ${score}\n\nDhea Phoenix jatuh. Coba lagi?`;
        startBtn.innerText = "MAIN LAGI";
    }

    // Fungsi reset spesifik burung
    dhea.reset = function() {
        this.velocity = 0;
        this.angle = 0;
    }

    // Input Handler
    function handleAction(e) {
        if (e.type === 'keydown' && e.code !== 'Space') return;
        
        if (gameState === 'playing') {
            dhea.jump();
        } else if (gameState === 'standby' || gameState === 'gameover') {
            // Hindari start tidak sengaja jika klik tombol 'Lompat' saat mati
            if (e.target.id !== 'jumpBtn') {
                startGame();
            }
        }
    }

    // Listener untuk PC dan Mobile
    window.addEventListener('keydown', handleAction);
    canvas.addEventListener('click', handleAction);
    jumpBtn.addEventListener('touchstart', (e) => { e.preventDefault(); handleAction(e); }); // Mobile


    // Fix: Web Audio API membutuhkan interaksi user sebelum bisa bunyi
    let audioInitialized = false;
    function initAudio() {
        if (audioInitialized) return;
        audioCtx.resume().then(() => {
            audioInitialized = true;
        });
    }

    // Memulai loop gambar background feathers bahkan sebelum game mulai
    gameLoop(); 
    gameState = 'standby'; // Set awal ke standby

</script>
</body>
</html>
